# `typos` spellchecker configuration for `bamabi-strata`

[files]
extend-exclude = [
    "target/",
    "**/target/",
    "Cargo.lock",
    "**/Cargo.lock",
    "*.dylib",
    "*.so",
    "*.dll",
]

[default]
extend-ignore-re = [
    "0x[0-9a-fA-F_]+",
    "\"[A-Za-z0-9_]+\"",
]

[default.extend-identifiers]
# Intentional compiler, ABI, Cranelift, and ECS identifiers
nd = "nd"
ro = "ro"
ot = "ot"
ba = "ba"
pn = "pn"
fref = "fref"
ser = "ser"
Stratac = "Stratac"
STRATAC = "STRATAC"
sdesc = "sdesc"
cdesc = "cdesc"
rdesc = "rdesc"
qdesc = "qdesc"
qdescs = "qdescs"
qterms = "qterms"
rterms = "rterms"
qres = "qres"
qrc = "qrc"
f32s = "f32s"
brp = "brp"
tro = "tro"
strat = "strat"
StratHealth = "StratHealth"
datas = "datas"
sp_datas = "sp_datas"
_anc = "_anc"
after_lits = "after_lits"
aw_lits = "aw_lits"
set_lits = "set_lits"
clen = "clen"
clen_raw = "clen_raw"
clen_i32 = "clen_i32"
clen_slot = "clen_slot"
clen_ptr = "clen_ptr"
clen_pos = "clen_pos"
rcall = "rcall"
rin = "rin"
befores = "befores"
onef = "onef"

[default.extend-words]
# Domain acronyms, crates, and technical terms
soa = "soa"
stratac = "stratac"
bamabi = "bamabi"
cranelift = "cranelift"
proptest = "proptest"
kani = "kani"
