[package]
name = "tree-sitter-strata"
description = "Strata v2.0 grammar for tree-sitter"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yaga-simha/bamabi-strata"
publish = false
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = "0.8"
hotpath = { version = "0.32", features = ["criterion-0-8"] }
streaming-iterator = "0.1"
tree-sitter = "0.24"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[[bench]]
name = "highlight_bench"
harness = false

[profile.profiling]
inherits = "release"
debug = true

[workspace]
