[workspace]
resolver = "2"
members = [
    "crates/strata_syntax",
    "crates/bamabi_native_rt",
    "crates/strata_sema",
    "crates/strata_mir",
    "crates/strata_codegen",
    "crates/strata_jit",
    "crates/strata_lsp",
    "crates/stratac",
    "crates/strata_docs",
    "benches/strata_bench",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bamabi authors"]
repository = "https://github.com/yaga-simha/bamabi-strata"
keywords = ["bevy", "ecs", "compiler", "gamedev", "dsl"]
categories = ["compilers", "game-development"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[workspace.dependencies]
bamabi_sys = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_macros = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_sdk_gen = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_guest_sys = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_guest = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_host = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-core.git", branch = "main" }
bamabi_manifest = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-tools.git", branch = "main" }
bamabi_trust = { version = "0.3.0", git = "https://github.com/yaga-simha/bamabi-tools.git", branch = "main", features = ["keygen"] }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
strata_syntax = { version = "0.3.0", path = "crates/strata_syntax" }
strata_sema = { version = "0.3.0", path = "crates/strata_sema" }
strata_mir = { version = "0.3.0", path = "crates/strata_mir" }
strata_codegen = { version = "0.3.0", path = "crates/strata_codegen" }
strata_jit = { version = "0.3.0", path = "crates/strata_jit" }
strata_lsp = { version = "0.3.0", path = "crates/strata_lsp" }
stratac = { version = "0.3.0", path = "crates/stratac" }
bamabi_native_rt = { version = "0.3.0", path = "crates/bamabi_native_rt" }
logos = "0.15"
rowan = "0.16"
salsa = "0.28.5"
proptest = "1"
cranelift-codegen = "0.135.10"
cranelift-frontend = "0.135.10"
cranelift-module = "0.135.10"
cranelift-object = "0.135.10"
target-lexicon = "0.13"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
stats_alloc = "0.1"
